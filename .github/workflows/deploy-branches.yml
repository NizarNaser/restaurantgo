name: Build Hostinger deploy branches

# Builds the two Vite frontends and a vendor-less copy of the API, then pushes
# them together to the "deploy" branch. hPanel's
# Git deployment pulls those branches into the matching folders on Hostinger
# Business (shared hosting has no Node.js, so the build has to happen here).
# See HOSTINGER_BUSINESS_DEPLOYMENT.md.
#
# VITE_BASE_DOMAIN is left empty on purpose: tested 2026-09-30 on the actual
# Hostinger Business account and per-tenant subdomains don't work on this
# plan (no Wildcard SSL option; an unregistered subdomain hits Hostinger's
# parking page, not this app) — see §9. Restaurants are served at
# app.restaurantgo.org/p/{slug} instead. Do not re-enable without first
# re-testing §9 step 1 on an upgraded/VPS plan.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branches
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web
        working-directory: web
        run: |
          printf 'VITE_API_URL=https://api.restaurantgo.org/api\nVITE_RESTAURANT_SITE_URL=https://app.restaurantgo.org\nVITE_BASE_DOMAIN=\n' > .env.production
          npm ci
          npm run build

      - name: Build dashboard
        working-directory: dashboard
        run: |
          printf 'VITE_API_URL=https://api.restaurantgo.org/api\nVITE_BASE_DOMAIN=\n' > .env.production
          npm ci
          npm run build

      - name: Prepare api (without vendor; composer runs on the server)
        run: |
          mkdir -p out/api
          rsync -a --exclude vendor --exclude node_modules --exclude .env api/ out/api/
          # The api folder sits inside public_html on shared hosting. Only
          # api.restaurantgo.org (whose document root is api/public) may reach
          # it; any other host (e.g. restaurantgo.org/<folder>/.env) gets 403.
          cat > out/api/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteCond %{HTTP_HOST} !^api\.restaurantgo\.org$ [NC]
              RewriteRule ^ - [F]
          </IfModule>
          <FilesMatch "^\.">
              Require all denied
          </FilesMatch>
          EOF

      - name: Push deploy branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish() {
            src="$1"; branch="$2"; tmp="$(mktemp -d)"
            if git clone -q --depth 1 --branch "$branch" "$REPO" "$tmp" 2>/dev/null; then :; else
              git init -q -b "$branch" "$tmp"
              git -C "$tmp" remote add origin "$REPO"
            fi
            rsync -a --delete --exclude .git "$src"/ "$tmp"/
            git -C "$tmp" add -A
            if git -C "$tmp" diff --cached --quiet; then
              echo "$branch: no changes"
            else
              git -C "$tmp" -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
                commit -q -m "Build ${GITHUB_SHA::7}"
              git -C "$tmp" push -q origin "$branch"
            fi
          }
          # hPanel allows one Git deployment per website, so everything goes
          # into a single "deploy" branch deployed to public_html:
          #   /            -> web (restaurantgo.org)
          #   /rgo-app/    -> dashboard (app.restaurantgo.org)
          #   /rgo-api/    -> api (api.restaurantgo.org -> rgo-api/public)
          # rgo-api/.gitignore keeps vendor/, .env and uploads on the server
          # across deployments (hPanel preserves git-ignored paths).
          mkdir -p out/deploy
          rsync -a web/dist/ out/deploy/
          rsync -a dashboard/dist/ out/deploy/rgo-app/
          rsync -a out/api/ out/deploy/rgo-api/
          publish out/deploy deploy
