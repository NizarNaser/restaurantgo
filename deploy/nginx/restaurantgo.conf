# Reverse proxy for the whole platform on a single Hostinger VPS.
#
# One wildcard certificate covers every hostname here — issue it for
# exactly these three names (see HOSTINGER_DEPLOYMENT.md for the certbot
# command): restaurantgo.com, www.restaurantgo.com, *.restaurantgo.com.
# `api.` and `app.` don't need their own SAN entries — they're already
# subdomains, so the wildcard covers them too.
#
# Replace every "restaurantgo.com" below with your real base domain (must
# match APP_BASE_DOMAIN / VITE_BASE_DOMAIN in the apps' .env files).

# Plain-HTTP: only ACME challenges succeed here, everything else redirects.
server {
    listen 80;
    listen [::]:80;
    server_name restaurantgo.com www.restaurantgo.com api.restaurantgo.com app.restaurantgo.com *.restaurantgo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# api.restaurantgo.com -> Laravel API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.restaurantgo.com;

    ssl_certificate     /etc/letsencrypt/live/restaurantgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurantgo.com/privkey.pem;

    # Menu item photos / branding uploads.
    client_max_body_size 20m;

    location / {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# restaurantgo.com / www.restaurantgo.com -> marketing + directory site (`web`)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name restaurantgo.com www.restaurantgo.com;

    ssl_certificate     /etc/letsencrypt/live/restaurantgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurantgo.com/privkey.pem;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# app.restaurantgo.com (staff/admin entry point) and every *.restaurantgo.com
# tenant subdomain both point at the same `dashboard` container — the SPA
# itself tells the two apart from the Host header (see
# dashboard/src/lib/publicSite.ts) and renders either the staff dashboard or
# that one tenant's public menu/blog/ordering pages.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.restaurantgo.com *.restaurantgo.com;

    ssl_certificate     /etc/letsencrypt/live/restaurantgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurantgo.com/privkey.pem;

    location / {
        proxy_pass http://dashboard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
