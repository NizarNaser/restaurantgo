# RestoAtlas on the Hostinger VPS (native nginx + PHP-FPM, no Docker).
#
# Install: copy to /etc/nginx/sites-available/restoatlas.conf, symlink it into
# sites-enabled, `nginx -t && systemctl reload nginx`. See
# docs/REBRAND_CHECKLIST.md for the full order of steps.
#
# Certificate: one Let's Encrypt cert for restoatlas.com + *.restoatlas.com
# (DNS-01 challenge, see the checklist). The wildcard covers www., app., api.
# and every tenant subdomain.
#
# Before enabling, check two values against the box:
#   - the PHP-FPM socket (`ls /run/php/`), here php8.3-fpm.sock
#   - the app root, here /var/www/restoatlas (the deploy workflow's path)

# Plain HTTP -> HTTPS on the same host.
server {
    listen 80;
    listen [::]:80;
    server_name restoatlas.com www.restoatlas.com *.restoatlas.com;

    return 301 https://$host$request_uri;
}

# www -> apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.restoatlas.com;

    ssl_certificate     /etc/letsencrypt/live/restoatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restoatlas.com/privkey.pem;

    return 301 https://restoatlas.com$request_uri;
}

# api.restoatlas.com -> Laravel API (api/public).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.restoatlas.com;

    ssl_certificate     /etc/letsencrypt/live/restoatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restoatlas.com/privkey.pem;

    root /var/www/restoatlas/api/public;
    index index.php;

    # Menu item photos / branding uploads.
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# restoatlas.com -> marketing + directory site (`web` build).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name restoatlas.com;

    ssl_certificate     /etc/letsencrypt/live/restoatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restoatlas.com/privkey.pem;

    root /var/www/restoatlas/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# app.restoatlas.com (staff dashboard) and every {slug}.restoatlas.com tenant
# site share the `dashboard` build — the SPA tells them apart from the Host
# header (dashboard/src/lib/publicSite.ts).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.restoatlas.com *.restoatlas.com;

    ssl_certificate     /etc/letsencrypt/live/restoatlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restoatlas.com/privkey.pem;

    root /var/www/restoatlas/dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
