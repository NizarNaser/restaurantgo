# Legacy restaurantgo.org -> restoatlas.com (rebrand, 2026-10).
#
# Keep this file enabled for as long as restaurantgo.org stays registered
# (at least 12 months) so old links, QR codes and bookmarks keep working.
#
#   restaurantgo.org/*         -> 301 https://restoatlas.com/*
#   www.restaurantgo.org/*     -> 301 https://restoatlas.com/*
#   app.restaurantgo.org/*     -> 301 https://app.restoatlas.com/*
#   {slug}.restaurantgo.org/*  -> 301 https://{slug}.restoatlas.com/*
#   api.restaurantgo.org/*     -> NOT redirected: still served by the API so
#                                 POST requests, Stripe/PayPal webhooks and
#                                 installed POS apps keep working. Every hit
#                                 goes to a separate deprecation log.
#
# $request_uri carries the original path *and* query string.
#
# Needs the existing certificate for restaurantgo.org + *.restaurantgo.org
# (adjust the paths below to what `certbot certificates` shows). Exact
# server_names (www., app., api.) take priority over the {slug} regex.

server {
    listen 80;
    listen [::]:80;
    server_name restaurantgo.org www.restaurantgo.org;

    return 301 https://restoatlas.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.restaurantgo.org;

    return 301 https://app.restoatlas.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<slug>[a-z0-9-]+)\.restaurantgo\.org$;

    return 301 https://$slug.restoatlas.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name restaurantgo.org www.restaurantgo.org;

    ssl_certificate     /etc/letsencrypt/live/restaurantgo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurantgo.org/privkey.pem;

    return 301 https://restoatlas.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.restaurantgo.org;

    ssl_certificate     /etc/letsencrypt/live/restaurantgo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurantgo.org/privkey.pem;

    return 301 https://app.restoatlas.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(?<slug>[a-z0-9-]+)\.restaurantgo\.org$;

    ssl_certificate     /etc/letsencrypt/live/restaurantgo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurantgo.org/privkey.pem;

    return 301 https://$slug.restoatlas.com$request_uri;
}

# api.restaurantgo.org: keep serving the API during the transition period.
# Plain HTTP is still upgraded on the same host (not to the new domain), so
# the scheme change is the only thing a legacy client ever sees.
server {
    listen 80;
    listen [::]:80;
    server_name api.restaurantgo.org;

    return 301 https://api.restaurantgo.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.restaurantgo.org;

    ssl_certificate     /etc/letsencrypt/live/restaurantgo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurantgo.org/privkey.pem;

    # Deprecation notice: who is still calling the old host. Check with
    #   awk '{print $7}' /var/log/nginx/restaurantgo-api-deprecated.log | sort | uniq -c | sort -rn | head
    # and turn this block off once it goes quiet (and the old POS APK is gone).
    access_log /var/log/nginx/restaurantgo-api-deprecated.log;
    add_header Deprecation "true" always;
    add_header Link "<https://api.restoatlas.com>; rel=\"successor-version\"" always;

    root /var/www/restoatlas/api/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
